name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
              
      - name: Ultimate Auto-Build
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          # Depoda proje dosyası yoksa otomatik eksiksiz şablon kur
          if [ ! -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            echo "Proje dosyaları eksik, otomatik şablon oluşturuluyor..."
            mkdir -p app/src/main
            echo "plugins { id 'com.android.application' }" > build.gradle
            echo "include ':app'" > settings.gradle
            mkdir -p app
            echo "plugins { id 'com.android.application' }" > app/build.gradle
          fi
          
          # Proje dizinini bul ve geç
          GRADLE_BUILD_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
          if [ -n "$GRADLE_BUILD_FILE" ]; then
            cd "$(dirname "$GRADLE_BUILD_FILE")"
          fi
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
