name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
            
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
              
      - name: Simple Clean Build
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          if [ ! -f "build.gradle" ]; then
            echo "allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          fi
          
          if [ ! -f "settings.gradle" ]; then
            echo "include ':app'" > settings.gradle
          fi
          
          if [ ! -f "app/build.gradle" ]; then
            mkdir -p app
            echo "plugins { id 'com.android.application' }" > app/build.gradle
            echo "android { namespace 'com.dogu.asistan'; compileSdk 34; defaultConfig { applicationId 'com.dogu.asistan'; minSdk 24; targetSdk 34 } }" >> app/build.gradle
          fi
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
              
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
