name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Find and Build Android Project
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          # settings.gradle veya build.gradle dosyasını içeren klasörü kesin olarak bul
          GRADLE_BUILD_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
          
          if [ -z "$GRADLE_BUILD_FILE" ]; then
            echo "HATA: Hiçbir Gradle proje dosyası bulunamadı!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_BUILD_FILE")
          echo "Bulunan proje dizini: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # SDK yolunu proje dizinine yaz
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Derlemeyi başlat
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
