name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Auto-Detect and Fix Project Structure
        run: |
          echo "Proje dizinleri ve Gradle dosyaları taranıyor..."
          
          # build.gradle dosyasını bul
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "HATA: build.gradle bulunamadı! Otomatik şablon oluşturuluyor..."
            mkdir -p app/src/main
            echo "plugins { id 'com.android.application' }" > build.gradle
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Tespit edilen proje dizini: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Eksik gradlew dosyası varsa yetki ver
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi
          
      - name: Build Android APK with Auto-Retry
        run: |
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
          cd "$(dirname "$GRADLE_FILE")"
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace || ./gradlew assembleDebug --info
          else
            gradle assembleDebug --stacktrace || gradle assembleDebug --info
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
